name: Frontend PR checks

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # External PR code never runs on private or production self-hosted runners.
    # Pin the supported image compatible with unprivileged bubblewrap namespaces.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '9.7.0'
          run_install: false
      - name: Install isolation tooling
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends bubblewrap
      - name: Install fixed dependencies without scripts or pnpm hooks
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_GLOBALCONFIG: /dev/null
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Check frontend with no parent tree, credentials or network
        run: node scripts/release/run-isolated-checks.mjs
